services:
  wish-deno:
    image: ghcr.io/nehoko/wish-deno:latest
    container_name: wish-deno
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      COOKIE_SECURE: "true"
      DATABASE_PATH: /data/wish-deno.sqlite
      HOST: 0.0.0.0
      PORT: "8000"
      PUBLIC_DIR: /app/public
    volumes:
      - wish-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - deno
        - eval
        - "const p=Deno.env.get('PORT')??'8000';const r=await fetch('http://127.0.0.1:'+p+'/health');if(!r.ok)Deno.exit(1)"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  wish-data:
