name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Deno quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4
          cache: true
      - name: Check formatting
        run: deno fmt --check
      - name: Lint
        run: deno lint
      - name: Type-check
        run: deno check src/main.ts tests/*.ts
      - name: Test
        run: deno test --allow-net --allow-read --allow-write --allow-env

  container:
    name: Container smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build local image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: wish-deno:ci
          build-args: |
            REPOSITORY=${{ github.repository }}
      - name: Start container
        run: >-
          docker run -d --name wish-deno-ci
          --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m
          --mount type=volume,src=wish-deno-ci-data,dst=/data
          --health-interval=1s --health-start-period=0s
          -p 127.0.0.1:18080:8000
          wish-deno:ci
      - name: Wait for readiness
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18080/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs wish-deno-ci
          exit 1
      - name: Verify image healthcheck
        run: |
          for attempt in {1..10}; do
            status="$(docker inspect --format '{{.State.Health.Status}}' wish-deno-ci)"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              docker inspect --format '{{json .State.Health}}' wish-deno-ci
              exit 1
            fi
            sleep 1
          done
          docker inspect --format '{{json .State.Health}}' wish-deno-ci
          exit 1
      - name: Show logs after failure
        if: failure()
        run: docker logs wish-deno-ci
      - name: Clean up
        if: always()
        run: |
          docker rm --force --volumes wish-deno-ci || true
          docker volume rm wish-deno-ci-data || true
